name: Pinterest — renovar OAuth
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
permissions:
  contents: read
concurrency:
  group: pinterest-oauth-renewal
  cancel-in-progress: false
jobs:
  renovar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renovar e guardar tokens
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python integracoes/pinterest/renovar.py
