name: Pinterest — publicar três artes MiraDesconto
on:
  push:
    branches: [main]
    paths:
      - 'assets/pinterest/acer-aspire-go-i7.png'
      - 'assets/pinterest/smart-tag-android.png'
      - 'assets/pinterest/camera-wifi-a28b.png'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinterest-publicar-tres
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar e publicar os três Pins aprovados
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python integracoes/pinterest/publicar_lote.py
