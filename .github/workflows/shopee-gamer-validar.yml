name: Shopee — verificar lote gamer
on:
  push:
    branches: [codex/shopee-ofertas-gamer]
    paths: [.github/workflows/shopee-gamer-validar.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir preços e destinos da Shopee
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          CANDIDATES: '[["1930141978","58270361666","cadeira gamer"],["1083800536","58212667892","monitor gamer 144hz"],["1509845472","18199896152","placa de video rtx"],["1517155365","58217415885","ssd nvme 1tb"],["627750190","18499319393","headset gamer"],["1177836673","43430323253","mouse gamer sem fio"],["1177836673","46352561853","teclado mecanico switch red"],["1782039369","58209387442","cadeira gamer"],["1930141978","58270168537","monitor gamer 144hz"],["778397589","57007125136","placa de video rtx"],["1001075556","55563851252","ssd nvme 1tb"],["1847606927","58265106071","headset gamer"],["1930141978","58270475720","mouse gamer sem fio"],["1379077822","44204958454","cadeira gamer"],["1001075556","54412838741","placa de video rtx"],["316399484","21197975332","headset gamer"],["1376503103","47216757444","mouse gamer sem fio"],["344381236","55966860434","placa de video rtx"],["376716003","23897906315","headset gamer"],["1672861664","57814408255","mouse gamer sem fio"],["1343318906","46415108512","headset gamer"],["1672861664","56515934418","mouse gamer sem fio"],["377074801","43700210394","cadeira gamer"],["1552226494","58262237367","headset gamer"],["373745451","23393005534","mouse gamer sem fio"],["1672861664","53315934582","headset gamer"],["1573953914","23798834583","mouse gamer sem fio"],["627750190","22093243578","headset gamer"],["1376503103","45114525361","headset gamer"],["627750190","22698917835","headset gamer"],["1101261117","23299256301","headset gamer"],["627750190","58256157077","headset gamer"],["1771775889","41082889384","headset gamer"],["373745451","51007027249","headset gamer"],["627750190","18698313097","headset gamer"]]'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, build_opener

          from integracoes.shopee.afiliados import ApiError, Shopee, product_summary, quoted, short_link, tokens

          api = Shopee(os.environ["SHOPEE_APP_ID"], os.environ["SHOPEE_APP_SECRET"])
          candidates = json.loads(os.environ["CANDIDATES"])
          now = int(time.time())
          checked_at = datetime.fromtimestamp(now, timezone.utc).isoformat()


          def verify_candidate(candidate):
              shop_id, item_id, keyword = candidate
              try:
                  rows = api.products(shopId=int(shop_id), itemId=int(item_id), limit=1)
                  if not rows:
                      rows = api.products(itemId=int(item_id), limit=1)
              except ApiError:
                  return None, "consulta indisponível"
              for row in rows:
                  if (str(row.get("shopId")), str(row.get("itemId"))) != (shop_id, item_id):
                      continue
                  offer = product_summary(row)
                  if not offer["price_min_brl"] or not offer["price_max_brl"]:
                      return None, "preço indisponível"
                  if offer["offer_ends_at"] and int(offer["offer_ends_at"]) <= now:
                      return None, "oferta encerrada"
                  if not tokens(keyword) <= tokens(offer["title"]):
                      return None, "título divergente"
                  image = row.get("imageUrl") or ""
                  parts = urlsplit(image)
                  image = image if parts.scheme == "https" and any((parts.hostname or "").endswith(suffix) for suffix in (".susercontent.com", ".shopee.com.br", ".shopeemobile.com")) else None
                  return {**offer, "image_url": image, "keyword": keyword, "checked_at": checked_at}, None
              return None, "anúncio sem oferta confirmada"


          class ShopeeRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  parts = urlsplit(newurl)
                  host = parts.hostname or ""
                  if parts.scheme != "https" or parts.username or not (host == "shopee.com.br" or host.endswith(".shopee.com.br")):
                      raise ValueError("redirecionamento fora da Shopee")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          def verify_link(offer):
              url = links.get(offer["product_url"])
              if not url:
                  return None, "link de afiliado não gerado"
              try:
                  with build_opener(ShopeeRedirects()).open(url, timeout=16) as response:
                      path = urlsplit(response.geturl()).path.rstrip("/")
              except (URLError, TimeoutError, ValueError):
                  return None, "destino do link indisponível"
              shop, item = offer["shop_id"], offer["item_id"]
              if not path.endswith((f"/product/{shop}/{item}", f"/opaanlp/{shop}/{item}", f"-i.{shop}.{item}")):
                  return None, "destino do link divergente"
              return {**offer, "affiliate_url": url}, None


          with ThreadPoolExecutor(max_workers=5) as pool:
              checked = list(pool.map(verify_candidate, candidates))
              accepted = [offer for offer, error in checked if offer]
              reasons = Counter(error for offer, error in checked if error)
              print(f"Ofertas e preços confirmados: {len(accepted)}/{len(candidates)}", flush=True)
              if not accepted:
                  raise SystemExit("Nenhum anúncio passou na verificação de preço.")
              inputs = ", ".join(f'{{originUrl: {quoted(offer["product_url"])}}}' for offer in accepted)
              result = api.call("generateBatchShortLink", "links { originUrl shortLink success }",
                                mutation=True, input=f"{{links: [{inputs}]}}")
              links = {}
              for entry in result.get("links") or []:
                  if entry.get("success"):
                      try:
                          links[entry["originUrl"]] = short_link(entry)
                      except ApiError:
                          continue
              verified = list(pool.map(verify_link, accepted))

          published = [offer for offer, error in verified if offer]
          reasons.update(error for offer, error in verified if error)
          print(f"Links de afiliado confirmados: {len(published)}; exclusões na verificação: {dict(reasons)}", flush=True)
          print("Por termo:", dict(Counter(offer["keyword"] for offer in published)), flush=True)
          if not published:
              raise SystemExit("Nenhum link de afiliado passou na verificação de destino.")
          Path("preview").mkdir(exist_ok=True)
          Path("preview/shopee_gamer_publicados.json").write_text(
              json.dumps(published, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shopee-gamer-validados
          path: preview/shopee_gamer_publicados.json
          if-no-files-found: error
          retention-days: 3
