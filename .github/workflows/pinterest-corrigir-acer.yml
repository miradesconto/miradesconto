name: Pinterest — corrigir destino Acer existente
on:
  push:
    branches: [main]
    paths: ['integracoes/pinterest/corrigir_acer.py']
permissions:
  contents: read
concurrency:
  group: pinterest-manual-publish
  cancel-in-progress: false
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Editar link do Pin Acer sem criar outro
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python integracoes/pinterest/corrigir_acer.py
