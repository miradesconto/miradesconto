name: Inicializar histórico de preços
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Recuperar também evidências dos commits dos últimos 180 dias
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mercadolivre-sync
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integracoes/cloudflare/history-requirements.txt -r integracoes/social/requirements.txt
      - run: python -m unittest discover -s tests -p test_price_history.py
      - name: Migrar arquivos existentes para Cloudflare
        env:
          MIRA_HISTORY_BASE_URL: ${{ vars.MIRA_HISTORY_BASE_URL }}
          MIRA_HISTORY_WRITE_TOKEN: ${{ secrets.MIRA_HISTORY_WRITE_TOKEN }}
        run: python integracoes/mercadolivre/price_history.py --migrate-local ${{ inputs.backfill && '--backfill' || '' }}
