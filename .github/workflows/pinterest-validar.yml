name: Pinterest — validar conexão
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar OAuth (somente leitura)
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: python integracoes/pinterest/validar.py
