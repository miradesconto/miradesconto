name: Validar catálogo e gerar prévia
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar dados e testar falhas sem rede
        run: |
          python integracoes/catalogo.py check
          python integracoes/campanha.py --check
          node tests/test-afiliados.cjs
          python -m unittest discover -s tests -v
          python integracoes/automacao/site_health.py
          node test-catalogo.cjs
          node tests/test-offer-rotation.cjs
          node tests/test-price-refresh.cjs
          node tests/test-vitrine-cro.cjs
          node --check carrossel.js
          node tests/test-hero-shopee.cjs
          node blog/verify.cjs
          node tests/test-editorial-coverage.cjs
          node tests/test_editorial_visual.cjs
          node tests/test-qualidade.cjs
          node tests/test-catalogo-evidence.cjs
          node tests/test-analytics.cjs
          node --check gamer.js
          node --check modo-visual.js
          node tests/test-modo-visual.cjs
      - name: Confirmar geração reproduzível
        run: |
          python integracoes/catalogo.py generate
          python integracoes/campanha.py
          git diff --exit-code -- produtos.js catalogo _data/produtos.json _ofertas _data/ofertas_site.json produtos-extras.js docs/pinterest-destinos.json
      - name: Construir prévia estática
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verificar SEO e links no HTML publicado
        run: python tests/verify-built-site.py _site
      - name: Confirmar visual Clássico e Gamer na prévia
        run: |
          test -s _site/index.html
          test -s _site/gamer.html
          test -s _site/gamer.js
          test -s _site/gamer.css
          test -s _site/modo-visual.js
          test -s _site/modo-visual.css
          grep -q 'href="?modo=gamer"' _site/index.html
          grep -q 'modo-visual.css?v=2' _site/index.html
          grep -q 'url=/?modo=gamer' _site/gamer.html
          test -s _site/api/produtos.json
          grep -q 'id="hero-product-seeds"' _site/index.html
          grep -q 'data-hero-offer' _site/index.html
          grep -q '/assets/ofertas/' _site/index.html
      - name: Guardar prévia para revisão, sem publicar
        uses: actions/upload-artifact@v4
        with:
          name: previa-site-${{ github.sha }}
          path: _site/
          retention-days: 7
