name: Mercado Livre — sincronizar catálogo
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'integracoes/mercadolivre/trigger.txt'
permissions:
  contents: write
  pages: write
concurrency:
  group: mercadolivre-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r integracoes/cloudflare/history-requirements.txt -r integracoes/social/requirements.txt
      - name: Validar cadastro e testar sem rede
        run: |
          python integracoes/catalogo.py check
          python -m unittest discover -s tests -v
      - name: Descobrir novos produtos nas listas cadastradas
        run: python integracoes/mercadolivre/import_links.py --sync
      - name: Confirmar preços nos cartões dos links de afiliado
        run: python integracoes/mercadolivre/public_prices.py
      - name: Guardar observações verificadas de preço
        id: history
        if: vars.MIRA_HISTORY_BASE_URL != ''
        continue-on-error: true
        env:
          MIRA_HISTORY_BASE_URL: ${{ vars.MIRA_HISTORY_BASE_URL }}
          MIRA_HISTORY_WRITE_TOKEN: ${{ secrets.MIRA_HISTORY_WRITE_TOKEN }}
        run: python integracoes/mercadolivre/price_history.py
      - name: Informar falha do histórico sem interromper preços confirmados
        if: steps.history.outcome == 'failure'
        run: echo '::warning::Histórico remoto falhou. Verifique a etapa de envio; o catálogo continuará com os preços confirmados.'
      - name: Atualizar Radar de Preços
        env:
          MIRA_HISTORY_BASE_URL: ${{ vars.MIRA_HISTORY_BASE_URL }}
        run: python integracoes/automacao/gerar_radar.py
      - name: Validar integridade antes de publicar
        run: |
          python integracoes/automacao/site_health.py
          node test-catalogo.cjs
          node blog/verify.cjs
          node tests/test-qualidade.cjs
          node tests/test-catalogo-evidence.cjs
      - name: Publicar melhor oferta no Telegram
        if: vars.MIRA_TELEGRAM_ENABLED == 'true'
        continue-on-error: true
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MIRA_GO_BASE_URL: ${{ vars.MIRA_GO_BASE_URL }}
          MIRA_SOCIAL_BASE_URL: ${{ vars.MIRA_SOCIAL_BASE_URL }}
          MIRA_SOCIAL_WRITE_TOKEN: ${{ secrets.MIRA_SOCIAL_WRITE_TOKEN }}
          TELEGRAM_TEXT_ONLY: ${{ vars.TELEGRAM_TEXT_ONLY }}
        run: python integracoes/social/gerar_pauta.py
      - name: Informar falha de publicação
        if: steps.telegram.outcome == 'failure'
        run: echo '::warning::Telegram não confirmou publicação. Confira o registro remoto antes de reenviar.'
      - name: Registrar somente mudanças reais
        shell: bash
        run: |
          if git diff --quiet -- dados/catalogo.json _data/radar.json && [ -z "$(git ls-files --others --exclude-standard _data/radar.json)" ]; then
            echo 'Nenhuma mudança real; sem commit.'
            exit 0
          fi
          python integracoes/automacao/atualizar_home.py
          python integracoes/automacao/cache_bust.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/catalogo.json links-afiliados.json produtos.js catalogo _data/produtos.json _data/radar.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Atualiza preços confirmados dos links de afiliado'
          # Never force-push or merge a stale catalog over concurrent edits.
          git push origin HEAD:main
      - name: Solicitar publicação no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN commits do not trigger branch-based Pages builds.
          # Also retry a previous failed build on an unchanged run.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
