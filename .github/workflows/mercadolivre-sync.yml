name: Mercado Livre — sincronizar catálogo

on:
  workflow_dispatch:
  schedule:
    # 09:00 e 21:00 no horário de Brasília (UTC-3).
    - cron: "0 0,12 * * *"
  push:
    paths:
      - "integracoes/mercadolivre/trigger.txt"

permissions:
  contents: write

concurrency:
  group: mercadolivre-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar cadastro antes da coleta
        run: |
          python integracoes/catalogo.py check
          python -m unittest discover -s tests -v

      - name: Sincronizar preços pelas páginas oficiais de afiliados
        id: sync
        run: python integracoes/mercadolivre/run_sync.py

      - name: Validar integridade antes de publicar
        run: |
          python integracoes/automacao/site_health.py
          node test-catalogo.cjs
          node blog/verify.cjs
          node tests/test-qualidade.cjs

      - name: Gerar pauta automática para redes sociais
        run: python integracoes/social/gerar_pauta.py

      - name: Atualizar artigos publicados na home
        run: python integracoes/automacao/atualizar_home.py

      - name: Atualizar versão dos assets para evitar cache antigo
        run: python integracoes/automacao/cache_bust.py

      - name: Registrar alterações do catálogo
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração de catálogo encontrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/catalogo.json produtos.js catalogo _data/produtos.json integracoes/mercadolivre/ultimo-sync.json index.html
          git add integracoes/social/pauta-do-dia.json integracoes/social/pauta-do-dia.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pública do catálogo para registrar."
            exit 0
          fi
          git commit -m "Atualiza catálogo Mercado Livre e pauta social"
          git push
