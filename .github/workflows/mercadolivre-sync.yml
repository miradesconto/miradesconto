name: Mercado Livre — sincronizar catálogo
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    paths:
      - 'integracoes/mercadolivre/trigger.txt'
      - '.github/workflows/mercadolivre-sync.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: mercadolivre-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar cadastro e testar sem rede
        run: |
          python integracoes/catalogo.py check
          python -m unittest discover -s tests -v
      - name: Descobrir novos produtos nas listas cadastradas
        run: python integracoes/mercadolivre/import_links.py --sync
      - name: Confirmar preços nos cartões dos links de afiliado
        run: python integracoes/mercadolivre/public_prices.py
      - name: Verificar cobertura de preços recentes
        run: python integracoes/automacao/price_freshness.py --require-fresh
      - name: Guardar observações verificadas de preço
        run: |
          if [ -d historico ]; then
            python integracoes/mercadolivre/price_history.py
          else
            python integracoes/mercadolivre/price_history.py --backfill
          fi
      - name: Atualizar Radar de Preços
        run: python integracoes/automacao/gerar_radar.py
      - name: Atualizar destinos permanentes e cadastro de campanha
        run: python integracoes/campanha.py
      - name: Validar integridade antes de publicar
        run: |
          python integracoes/automacao/site_health.py
          node test-catalogo.cjs
          node blog/verify.cjs
          node tests/test-qualidade.cjs
          node tests/test-catalogo-evidence.cjs
      - name: Registrar somente mudanças reais
        shell: bash
        run: |
          # A fila social é derivada do Radar e deve ser recalculada mesmo quando
          # a coleta de preço não altera o catálogo nesta execução.
          python integracoes/social/gerar_pauta.py
          if git diff --quiet -- dados/catalogo.json historico _data/radar.json integracoes/social/pauta-do-dia.json integracoes/social/pauta-do-dia.md && [ -z "$(git ls-files --others --exclude-standard historico _data/radar.json integracoes/social/pauta-do-dia.json integracoes/social/pauta-do-dia.md)" ]; then
            echo 'Nenhuma mudança real; sem commit.'
            exit 0
          fi
          python integracoes/automacao/atualizar_home.py
          python integracoes/automacao/cache_bust.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historico dados/catalogo.json links-afiliados.json produtos.js catalogo _data/produtos.json _data/radar.json index.html
          git add integracoes/social/pauta-do-dia.json integracoes/social/pauta-do-dia.md
          git add _ofertas _data/ofertas_site.json produtos-extras.js docs/pinterest-destinos.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualiza preços confirmados dos links de afiliado'
          # Never force-push or merge a stale catalog over concurrent edits.
          # Retry transient DNS/network failures without overwriting concurrent edits.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Solicitar publicação no GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN commits do not trigger branch-based Pages builds.
          # Also retry a previous failed build on an unchanged run.
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          request = Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pages/builds",
              data=b"{}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=30) as response:
                  print("Publicação solicitada: HTTP", response.status)
          except HTTPError as exc:
              raise SystemExit("Falha ao solicitar publicação: HTTP " + str(exc.code))
          except URLError:
              raise SystemExit("Falha de conexão ao solicitar publicação")
          PY
