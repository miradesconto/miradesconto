name: Mercado Livre — sincronizar catálogo

on:
  workflow_dispatch:
  schedule:
    # 09:00 e 21:00 no horário de Brasília (UTC-3).
    - cron: "0 0,12 * * *"
  push:
    paths:
      - "integracoes/mercadolivre/trigger.txt"

permissions:
  contents: write

concurrency:
  group: mercadolivre-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ML_CLIENT_ID: "5739104192519635"
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar criptografia
        run: python -m pip install --disable-pip-version-check "cryptography>=42,<48"

      - name: Validar credenciais obrigatórias
        shell: bash
        run: |
          if [ -z "$ML_CLIENT_SECRET" ]; then
            echo "ML_CLIENT_SECRET não foi configurado."
            exit 1
          fi
          if [ ! -f "integracoes/mercadolivre/refresh-token.enc" ] && [ -z "$ML_REFRESH_TOKEN" ]; then
            echo "ML_REFRESH_TOKEN não foi configurado e ainda não existe estado OAuth criptografado."
            exit 1
          fi

      - name: Sincronizar preços pelas páginas oficiais de afiliados
        id: sync
        run: python integracoes/mercadolivre/run_sync.py

      - name: Persistir estado OAuth rotativo
        if: always()
        shell: bash
        run: |
          if [ ! -f "integracoes/mercadolivre/refresh-token.enc" ]; then
            echo "Nenhum estado OAuth novo para persistir."
            exit 0
          fi
          if git diff --quiet -- integracoes/mercadolivre/refresh-token.enc && git ls-files --error-unmatch integracoes/mercadolivre/refresh-token.enc >/dev/null 2>&1; then
            echo "Estado OAuth já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integracoes/mercadolivre/refresh-token.enc
          git commit -m "Atualiza estado OAuth Mercado Livre"
          git push

      - name: Registrar alterações do catálogo
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração de catálogo encontrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos.js catalogo _data/produtos.json integracoes/mercadolivre/ultimo-sync.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pública do catálogo para registrar."
            exit 0
          fi
          git commit -m "Atualiza catálogo Mercado Livre"
          git push
