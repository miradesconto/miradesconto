name: Pinterest — publicar Pin revisado
on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Destino do Pin (site ou link direto Mercado Livre)"
        required: true
        default: "site"
        type: choice
        options:
          - site
          - mercado_livre
      article:
        description: "Somente site: slug de artigo publicado (sem /blog/)"
        required: false
        type: string
      affiliate_url:
        description: "Somente Mercado Livre: URL de afiliado gerada na Central (HTTPS)"
        required: false
        type: string
      affiliate_title:
        description: "Somente Mercado Livre: título revisado (até 100 caracteres)"
        required: false
        type: string
      caption:
        description: "Somente Mercado Livre: legenda informativa (20–300 caracteres)"
        required: false
        type: string
      board_id:
        description: "ID real da pasta na sua conta Pinterest"
        required: true
        type: string
      image_url:
        description: "Arte PNG/JPG própria, acessível em HTTPS no miradesconto.com.br"
        required: true
        type: string
      confirmation:
        description: "Digite PUBLICAR somente após revisar imagem, destino e aviso de afiliado"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pinterest-manual-publish
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar e publicar um único Pin aprovado
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          DESTINATION: ${{ inputs.destination }}
          ARTICLE: ${{ inputs.article }}
          AFFILIATE_URL: ${{ inputs.affiliate_url }}
          AFFILIATE_TITLE: ${{ inputs.affiliate_title }}
          CAPTION: ${{ inputs.caption }}
          BOARD_ID: ${{ inputs.board_id }}
          IMAGE_URL: ${{ inputs.image_url }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python integracoes/pinterest/publicar.py \
            --destination "$DESTINATION" --article "$ARTICLE" \
            --affiliate-url "$AFFILIATE_URL" --affiliate-title "$AFFILIATE_TITLE" \
            --caption "$CAPTION" --board-id "$BOARD_ID" \
            --image-url "$IMAGE_URL" --confirmation "$CONFIRMATION"
