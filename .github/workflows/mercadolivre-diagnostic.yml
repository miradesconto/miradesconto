name: Mercado Livre — diagnóstico API
on:
  workflow_dispatch:
  push:
    paths:
      - 'integracoes/mercadolivre/diagnostic-trigger.txt'
permissions:
  contents: read
concurrency:
  group: mercadolivre-api
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnosticar recursos oficiais sem alterar catálogo
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python integracoes/mercadolivre/api_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-api-${{ github.run_id }}
          path: integracoes/mercadolivre/api-status.json
          if-no-files-found: warn
          retention-days: 14
