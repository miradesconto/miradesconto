name: Mercado Livre — diagnóstico API

on:
  push:
    paths:
      - "integracoes/mercadolivre/diagnostic-trigger.txt"

permissions:
  contents: write

concurrency:
  group: mercadolivre-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ML_CLIENT_ID: "5739104192519635"
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar criptografia
        run: python -m pip install --disable-pip-version-check "cryptography>=42,<48"

      - name: Diagnosticar API
        run: python integracoes/mercadolivre/api_diagnostic.py

      - name: Persistir estado OAuth rotativo
        if: always()
        shell: bash
        run: |
          if [ ! -f "integracoes/mercadolivre/refresh-token.enc" ]; then
            exit 0
          fi
          if git diff --quiet -- integracoes/mercadolivre/refresh-token.enc; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integracoes/mercadolivre/refresh-token.enc
          git commit -m "Atualiza estado OAuth após diagnóstico"
          git push
