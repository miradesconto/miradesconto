name: Minerar ofertas (Shopee + Mercado Livre)
on:
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'integracoes/automacao/minerador_ofertas.py'
      - 'integracoes/automacao/minerador-requirements.txt'
      - 'tests/test_minerador_ofertas.py'
      - 'tests/probe_offer_images.py'
      - 'integracoes/automacao/cache_imagens_ofertas.py'
      - 'tests/test_cache_imagens_ofertas.py'
      - '.github/workflows/minerador-ofertas.yml'
  push:
    branches: [main]
    paths:
      - 'integracoes/automacao/minerador_ofertas.py'
      - 'integracoes/automacao/minerador-requirements.txt'
      - '.github/workflows/minerador-ofertas.yml'
      - 'ofertas-automaticas.js'
      - 'ofertas-automaticas.css'
      # 'api/produtos.json' deliberadamente não dispara o minerador novamente.
      # Isso evita um loop entre atualização do feed e cache das fotos.

concurrency:
  group: minerador-ofertas
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r integracoes/automacao/minerador-requirements.txt
      - name: Testar mineração, links e feed sem credenciais
        run: python -m unittest discover -s tests -p test_minerador_ofertas.py -v
      - name: Testar download, validação e cache local das imagens
        run: python -m unittest discover -s tests -p test_cache_imagens_ofertas.py -v
      - name: Validar espelhamento real de fotos dos marketplaces
        run: python integracoes/automacao/cache_imagens_ofertas.py
      - name: Validar sintaxe do frontend
        run: node --check ofertas-automaticas.js
      - name: Diagnosticar fotos de produto (CDNs)
        run: python tests/probe_offer_images.py

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r integracoes/automacao/minerador-requirements.txt
      - name: Descobrir Shopee e Mercado Livre e publicar feed
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          MERCADOLIVRE_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: python integracoes/automacao/minerador_ofertas.py --publish
      - name: Espelhar fotos oficiais e manter ofertas acessíveis mesmo sem CDN
        run: |
          # O minerador publicou o JSON; atualize a cópia local para sua última versão.
          git fetch origin main
          git reset --hard origin/main
          python integracoes/automacao/cache_imagens_ofertas.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/produtos.json _data/ofertas_automaticas.json _data/shopee_fotos_locais.json assets/ofertas
          if git diff --cached --quiet; then
            echo "Fotos já estão atualizadas"
          else
            git commit -m "chore: hospedar imagens verificadas Shopee e ML no próprio site"
            git push origin HEAD:main
          fi
