name: Shopee — teste de afiliados

on:
  push:
    branches: [codex/shopee-api-smoke]
    paths: [.github/workflows/shopee-api-smoke.yml]

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
    steps:
      - name: Consultar uma oferta e gerar o link
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          endpoint = "https://open-api.affiliate.shopee.com.br/graphql"
          app_id = os.environ.get("SHOPEE_APP_ID", "").strip()
          secret = os.environ.get("SHOPEE_APP_SECRET", "").strip()
          if not app_id or not secret:
              raise SystemExit("Secrets da Shopee ausentes ou vazios.")

          def graphql(operation, query):
              payload = json.dumps({"query": query}, separators=(",", ":")).encode()
              timestamp = str(int(time.time()))
              signature = hashlib.sha256(
                  (app_id + timestamp).encode() + payload + secret.encode()
              ).hexdigest()
              request = Request(endpoint, data=payload, headers={
                  "Content-Type": "application/json",
                  "Authorization": (
                      f"SHA256 Credential={app_id}, Timestamp={timestamp}, Signature={signature}"
                  ),
              })
              try:
                  with urlopen(request, timeout=20) as response:
                      result = json.load(response)
              except HTTPError as error:
                  raise SystemExit(f"{operation}: HTTP {error.code}.") from None
              except (URLError, TimeoutError, ValueError):
                  raise SystemExit(f"{operation}: falha de conexão ou resposta inválida.") from None
              if result.get("errors"):
                  codes = [e.get("extensions", {}).get("code") for e in result["errors"]]
                  meanings = {10000: "erro de sistema", 10010: "consulta inválida",
                              10020: "falha de autenticação", 10030: "limite de tráfego",
                              11000: "erro de processamento"}
                  safe_codes = [f"{c}: {meanings.get(c, 'desconhecido')}"
                                for c in codes if type(c) is int]
                  detail = ", ".join(safe_codes) or "sem código numérico"
                  raise SystemExit(f"{operation}: a Shopee retornou erro GraphQL ({detail}).")
              return result.get("data", {}).get(operation)

          def shopee_url(url):
              parts = urlsplit(url or "")
              return (
                  parts.scheme == "https"
                  and parts.username is None
                  and (parts.hostname == "shopee.com.br" or
                       (parts.hostname or "").endswith(".shopee.com.br"))
              )

          class ShopeeRedirects(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, new_url):
                  if not shopee_url(new_url):
                      raise ValueError("Redirecionamento fora da Shopee.")
                  return super().redirect_request(request, fp, code, msg, headers, new_url)

          # IDs do anúncio que já consta no catálogo do MiraDesconto.
          item_id, shop_id = 48360418130, 1672861664
          product_url = f"https://shopee.com.br/product/{shop_id}/{item_id}"

          def check_keyword():
              offers = graphql("productOfferV2", """
                query {
                  productOfferV2(keyword: "Attack Shark X11", sortType: 1, limit: 1) {
                    nodes { productName }
                  }
                }
              """)
              nodes = (offers or {}).get("nodes") or []
              title = nodes[0]["productName"] if nodes else ""
              if not re.search(r"\battack\s*shark\b.*\bx11\b", title, re.IGNORECASE):
                  raise SystemExit("A busca por palavra-chave não retornou o modelo esperado.")
              print("Busca por palavra-chave OK: Attack Shark X11.", flush=True)

          def check_offer():
              offers = graphql("productOfferV2", f"""
                query {{
                  productOfferV2(itemId: {item_id}, shopId: {shop_id}, limit: 1) {{
                    nodes {{ itemId shopId productName }}
                  }}
                }}
              """)
              nodes = (offers or {}).get("nodes") or []
              if not nodes:
                  raise SystemExit("Consulta autenticada, mas o anúncio não retornou oferta.")
              item = nodes[0]
              if (int(item["itemId"]), int(item["shopId"])) != (item_id, shop_id):
                  raise SystemExit("A consulta retornou outro anúncio.")
              title = re.sub(r"[^\w .,+()/-]", " ", item["productName"] or "").strip()
              print(f"Consulta OK: {title[:120]} (item {item_id}, loja {shop_id}).", flush=True)

          def check_affiliate_link():
              link = graphql("generateShortLink", f"""
                mutation {{
                  generateShortLink(input: {{originUrl: "{product_url}"}}) {{ shortLink }}
                }}
              """)
              short_url = (link or {}).get("shortLink")
              if not shopee_url(short_url):
                  raise SystemExit("A API não retornou um link curto válido da Shopee.")
              print("Geração do link de afiliado OK.", flush=True)

              try:
                  with build_opener(ShopeeRedirects()).open(short_url, timeout=20) as response:
                      final_path = urlsplit(response.geturl()).path
              except (URLError, TimeoutError, ValueError) as error:
                  detail = f"HTTP {error.code}" if isinstance(error, HTTPError) else "falha ao abrir"
                  raise SystemExit(f"Destino do link não verificado ({detail}).") from None
              expected_paths = (
                  f"-i.{shop_id}.{item_id}",
                  f"/product/{shop_id}/{item_id}",
                  f"/opaanlp/{shop_id}/{item_id}",
              )
              if not final_path.rstrip("/").endswith(expected_paths):
                  raise SystemExit("Destino do link não confirmado pelo ID do anúncio.")
              print("Destino OK: a Shopee redirecionou para a loja e o item esperados.")

          failed = False
          for check in (check_keyword, check_offer, check_affiliate_link):
              try:
                  check()
              except SystemExit as error:
                  print(f"Falha: {error}", flush=True)
                  failed = True
          raise SystemExit(int(failed))
          PY
