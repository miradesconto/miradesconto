name: Recuperar capas reais do blog
on:
  push:
    branches: [main]
    paths:
      - 'integracoes/automacao/cache_blog_covers.py'
      - '.github/workflows/cache-blog-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar fotos existentes dos produtos
        run: python integracoes/automacao/cache_blog_covers.py
      - name: Gravar fotos verificadas e referências locais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _artigos assets/blog/covers
          if ! git diff --cached --quiet; then
            git commit -m "fix(blog): salvar capas reais dos artigos no repositorio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
