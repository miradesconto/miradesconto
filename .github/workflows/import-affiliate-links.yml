name: Cadastrar links de afiliado
run-name: Cadastro solicitado por @${{ github.actor }}
on:
  push:
    paths:
      - 'integracoes/mercadolivre/cadastro-pendente.json'
  workflow_dispatch:
    inputs:
      links:
        description: Links oficiais de afiliado, separados por espaço (até 20)
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: mercadolivre-sync
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cadastrar e confirmar
        env:
          AFFILIATE_LINKS: ${{ inputs.links }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python integracoes/mercadolivre/import_links.py
      - name: Gerar e verificar publicação
        run: |
          python integracoes/automacao/atualizar_home.py
          python integracoes/campanha.py --select-pending
          python integracoes/campanha.py --check
          python integracoes/catalogo.py check
          python integracoes/automacao/site_health.py
          node test-catalogo.cjs
      - name: Salvar cadastro
        id: save
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/catalogo.json links-afiliados.json produtos.js catalogo _data/produtos.json index.html
          git add _ofertas _data/ofertas_site.json _data/black_friday.json produtos-extras.js docs/pinterest-destinos.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhuma mudança real no cadastro; sem commit nem publicação.'
            exit 0
          fi
          python integracoes/automacao/cache_bust.py
          git add index.html
          git commit -m 'Cadastra novos links oficiais de afiliado'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publicar
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          request = Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/pages/builds",
              data=b"{}",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urlopen(request, timeout=30) as response:
                  if response.status != 201:
                      raise SystemExit("Resposta inesperada ao solicitar publicação: HTTP " + str(response.status))
                  print("Publicação solicitada: HTTP", response.status)
          except HTTPError as exc:
              raise SystemExit("Falha ao solicitar publicação: HTTP " + str(exc.code)) from None
          except URLError:
              raise SystemExit("Falha de conexão ao solicitar publicação") from None
          PY
