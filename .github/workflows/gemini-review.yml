name: Gemini — revisar pull request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número do PR para reavaliar
        required: true
        type: string

permissions:
  contents: read
  checks: write

# Serialize publications instead of cancelling a process after it has written a check.
concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/gemini-recheck') ||
      startsWith(github.event.comment.body, '/gemini-override')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted main is materialized. PR objects are fetched as data by the script.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Revisar dados do PR e publicar check no head exato
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: python .github/scripts/gemini_gate.py
