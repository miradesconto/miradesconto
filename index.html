<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiraDesconto - Hardware & Tecnologia</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        #vitrine-produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #151b2b; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { max-width: 100%; border-radius: 5px; background: #fff; margin-bottom: 15px; }
        .card h3 { font-size: 16px; color: #fff; margin-bottom: 10px; }
        .card .loja { font-size: 12px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .card .preco { font-size: 24px; color: #10b981; font-weight: bold; margin-bottom: 15px; }
        .card .btn { display: inline-block; background: #10b981; color: #0b0f19; text-decoration: none; padding: 12px 15px; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        .card .btn:hover { background: #059669; }
    </style>
</head>
<body>
    <header>
        <h1 style="color: #fff; font-size: 32px; margin-bottom: 5px;">Mira<span style="color: #10b981;">Desconto</span></h1>
        <p style="color: #94a3b8;">Radar de ofertas e componentes em alta</p>
    </header>
    <main id="vitrine-produtos"></main>
    <script>
        async function carregarOfertas() {
            try {
                const resposta = await fetch('api/produtos.json');
                const produtos = await resposta.json();
                const container = document.getElementById('vitrine-produtos');
                container.innerHTML = '';
                
                produtos.forEach(p => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${p.imagem}" alt="${p.titulo}">
                            <h3>${p.titulo}</h3>
                            <p class="loja">${p.loja}</p>
                            <p class="preco">R$ ${p.preco_atual.toFixed(2).replace('.', ',')}</p>
                            <a href="${p.link_afiliado}" target="_blank" class="btn">Garantir Desconto</a>
                        </div>
                    `;
                });
            } catch (e) { 
                console.error("Erro:", e); 
            }
        }
        carregarOfertas();
    </script>
</body>
</html>
